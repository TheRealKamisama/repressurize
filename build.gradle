plugins {
    id 'scala'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

file('build.properties').withReader { reader ->
    def props = new Properties()
    props.load(reader)
    ext.config = new ConfigSlurper().parse(props)
}

def buildNumber = System.getenv('BUILDNUM')
ext.simpleVersion = buildNumber ? "${config.mod.version}.${buildNumber}" : "${config.mod.version}-DEV"
version = "${simpleVersion}-mc${config.minecraft.version}"
group = 'net.bdew'
archivesBaseName = config.mod.id
def runDirectory = findProperty('runDirectory') ?: 'run'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: config.minecraft.version
    runs {
        client {
            workingDirectory project.file(runDirectory)
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                register(config.mod.id) { source sourceSets.main }
            }
        }
        server {
            workingDirectory project.file(runDirectory)
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                register(config.mod.id) { source sourceSets.main }
            }
        }
    }
}

repositories {
    maven { url = uri('https://maven.blamejared.com') }
    maven { url = uri('https://api.modrinth.com/maven') }
    maven { url = uri('https://modmaven.dev') }
    maven { url = uri('https://mvn.bdew.net/mc') }
    maven {
        url = uri('https://pkgs.dev.azure.com/Kotori316/minecraft/_packaging/mods/maven/v1')
        content {
            includeModule('com.kotori316', 'scalablecatsforce')
            includeModule('org.typelevel', 'cats-core_2.13')
            includeModule('org.typelevel', 'cats-kernel_2.13')
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${config.minecraft.version}-${config.forge.version}"

    compileOnly "org.scala-lang:scala-library:${config.scala.version}"
    runtimeOnly("com.kotori316:scalablecatsforce:${config.slp.version}:with-library") {
        transitive = false
    }

    // bdlib is a required runtime mod and supplies the common GUI, capability,
    // multiblock, and data-slot APIs used throughout Pressure Pipes.
    compileOnly fg.deobf("net.bdew:bdlib:${config.bdlib.version}")
    runtimeOnly fg.deobf("net.bdew:bdlib:${config.bdlib.version}")

    compileOnly fg.deobf("mezz.jei:jei-1.20.1-common-api:${config.jei.version}")
    compileOnly fg.deobf("mezz.jei:jei-1.20.1-forge-api:${config.jei.version}")
    compileOnly fg.deobf("maven.modrinth:jade:${config.jade.version}")
    compileOnly fg.deobf("mekanism:Mekanism:${config.mekanism.version}:api")
    if (project.hasProperty('compatTest')) {
        runtimeOnly fg.deobf("mezz.jei:jei-1.20.1-forge:${config.jei.version}")
        runtimeOnly fg.deobf("maven.modrinth:jade:${config.jade.version}")
        runtimeOnly fg.deobf("mekanism:Mekanism:${config.mekanism.version}")
        runtimeOnly fg.deobf("maven.modrinth:enderio:${config.enderio.version}")
    }
}

sourceSets {
    main {
        scala.srcDirs = ['src/main/scala']
        resources.srcDirs = ['resources']
    }
    gameTest {
        java.srcDirs = ['src/gametest/java']
        resources.srcDirs = ['src/gametest/resources']
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

// Regression tests run inside Forge but are excluded from the distributable JAR.
minecraft.runs {
    client {
        if (project.hasProperty('migrationQa')) {
            property 'pressure.migrationQa', 'true'
            jvmArgs '-Xmx2G'
            mods { register('pressureqa') { source sourceSets.gameTest } }
        }
    }
    gameTestServer {
        workingDirectory project.file('build/gametest')
        property 'forge.enabledGameTestNamespaces', 'pressure'
        property 'forge.logging.console.level', 'info'
        mods {
            register(config.mod.id) {
                source sourceSets.main
            }
            register('pressureqa') { source sourceSets.gameTest }
        }
    }
}

if (project.hasProperty('compatTest')) {
    minecraft.runs.configureEach {
        property 'mixin.env.remapRefMap', 'true'
        property 'mixin.env.refMapRemappingFile', project.file('build/createSrgToMcp/output.srg').absolutePath
    }
    tasks.matching { it.name == 'runClient' || it.name == 'runGameTestServer' || it.name == 'runServer' }.configureEach {
        dependsOn 'createSrgToMcp'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.additionalParameters.addAll(['-release:17', '-Xmaxerrs', '500'])
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand(version: project.version)
    }
    exclude '**/*.psd'
    exclude '**/*.lang'
    exclude 'mcmod.info'
    exclude 'assets/pressure/config/**'
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : config.mod.id,
                'Specification-Vendor'    : 'Pressure Pipes Repressurized contributors',
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : simpleVersion,
                'Implementation-Vendor'   : 'Pressure Pipes Repressurized contributors',
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

tasks.register('qaJar', Jar) {
    dependsOn tasks.named('gameTestClasses')
    from sourceSets.gameTest.output
    archiveFileName = 'pressure-qa.jar'
    destinationDirectory = layout.buildDirectory.dir('qa')
}
reobf {
    qaJar {
        // The fixture calls inherited Minecraft methods on production mod subclasses.
        // Their hierarchy must be visible while remapping the separate helper JAR.
        classpath.from sourceSets.main.output, sourceSets.main.compileClasspath
    }
}
tasks.named('qaJar').configure { finalizedBy 'reobfQaJar' }
